# ========================================================
# SERVICIO NACIONAL DE ADUANA DEL ECUADOR - SENAE
# Configuración Proxy Inverso Nginx para Rocky Linux 9
# Ubicación: /etc/nginx/conf.d/senae-control-previo.conf
# ========================================================

server {
    listen 80;
    server_name controlprevio.aduana.gob.ec;

    # Tamaño máximo de expedientes y comprobantes físicos
    client_max_body_size 50M;

    # Registro de auditoría
    access_log /var/log/nginx/senae_access.log;
    error_log /var/log/nginx/senae_error.log warn;

    # Cabeceras de seguridad GovTech
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión gzip para alta concurrencia
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
